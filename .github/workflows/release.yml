# Release the MVPKG client on a version tag.  Like every mvx-lang package it
# publishes source PLUS a per-Pick account artifact — the manager is itself a
# downloadable PICK account you install from.  Asset names mirror the registry's
# artifact key (<base>-<ver>-<suffix>, base = name '/'->'_'):
#   source -> mvx-lang_mvpkg-<ver>-source.tar.gz
#   mvx    -> mvx-lang_mvpkg-<ver>-mvx-<os>-<arch>-<endian>.tar.gz  (compiled, native)
#   udt    -> mvx-lang_mvpkg-<ver>-udt-any-any-le.tar.gz            (BASIC, portable)
#
# The mvx account is compiled with the published mvx toolchain (mkpkg.sh); the
# udt account is pure BASIC + shell (cataloged on the target by install.sh), so
# it just stages + tars on a hosted runner — no container, no native code.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# Tag the bare version to release, e.g.:  git tag 1.0 && git push origin 1.0
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"
      # ONE rolling dev tag, moved to the HEAD of develop by the nightly when
      # there is something new.  It builds through THIS workflow rather than
      # a second copy of it, so a dev build is the same artifacts by the same
      # steps as a release -- the only way a dev build is worth having.
      - "dev"

  # A TAG PUSHED BY A WORKFLOW DOES NOT TRIGGER ONE.  GitHub will not let the
  # default GITHUB_TOKEN start another run -- it is how recursion is prevented
  # -- so the nightly's tag lands and nothing happens.  It dispatches this
  # workflow on the tag instead, which is the same build from the same ref.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/mvpkg
          title: mvpkg
          body: "MVPKG — the MultiValue package manager client (MVX + UniData). Source; indexed by the package registry."
          extra-exclude: docs        # the docs wiki submodule

  # ---- mvx binary: the MVPKG client account compiled with the mvx toolchain ---
  # No native extension (the CallC bridge is UniData-only) — mkpkg.sh compiles
  # BP/* into CATALOG/ with the published mvx-basic.  Native -> os/arch-locked.
  mvx-binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up the mvx toolchain (latest published build)
        uses: mvx-lang/mvx/.github/actions/setup-mvx@main
        with:
          version: latest
      - name: Build + stage the mvx account
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"; ARCH="$(uname -m)"; OS="linux"
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          BASE="mvx-lang_mvpkg-$VER-mvx-$OS-$ARCH-$ENDIAN"
          # build.sh catalogs BP/* IN-ACCOUNT so cross-refs (MVPKG.META -> HTTPGET)
          # resolve — mkpkg's independent bundling does not.  setup-mvx put mvx +
          # its drivers under $MVXHOME; build.sh takes $MVX / $MVX_DRIVERS overrides.
          MVX="$(command -v mvx)" MVX_DRIVERS="$MVXHOME/lib" sh build.sh
          test -x CATALOG/MVPKG
          # Compiled account: BP source + CATALOG verb + LIB subroutine .so's + VOC
          # + the cmd bundle + metadata; drop debug + runtime state.
          DIST="dist/$BASE"; rm -rf "$DIST"; mkdir -p "$DIST"
          for d in BP CATALOG LIB VOC VOC.DICT CMD.BP CMD.BP.DICT PKG mvpkg.json LICENSE README.md; do
            [ -e "$d" ] && cp -a "$d" "$DIST/" || true
          done
          find "$DIST" -name '*.dSYM' -prune -exec rm -rf {} + 2>/dev/null || true
          tar czf "$BASE.tar.gz" -C "$DIST" .
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish the mvx binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- udt account: the MVPKG client as a self-installing UniData account -----
  # Pure BASIC + shell (cataloged on the target by install.sh) — no compile, no
  # container, no self-hosted runner — so it stages + tars on a hosted runner and
  # is os/arch-independent (udt-any-any-le).  Unpacks to mvpkg/; cd mvpkg && ./install.sh
  udt-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage the udt account package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          BASE="mvx-lang_mvpkg-$VER-udt-any-any-le"
          rm -rf dist && mkdir -p dist
          sh udt/build-udt.sh dist              # stages dist/mvpkg/ (the account)
          tar czf "$BASE.tar.gz" -C dist mvpkg  # wrap mvpkg/ by name (clean, strippable)
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish the udt account asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- what kind of release is this? ----------------------------------------
  # LAST, because it is correcting the publish steps rather than joining them.
  # Both of them create the release as a side effect of uploading to it, and
  # neither is told what the release is: publish-source marks a pre-release with
  # `contains(ref_name, '-')`, which is FALSE for `dev`; udt-build hands
  # softprops only a tag_name, and its defaults are `prerelease: false` and
  # latest.  So whichever finishes last decides, and left alone a nightly dev
  # build would present itself as the newest stable one -- to the registry, and
  # to anyone installing this package by name.
  #
  # Both directions are set explicitly, for the same reason: leaving the stable
  # case alone means it keeps whatever that race happened to leave behind.
  mark:
    needs: [source, mvx-binary, udt-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # STABLE IS THE ONE THAT IS NOT A PRE-RELEASE.  dev, beta and rc all
          # are; a stable tag is anything with no suffix -- 2.1.0, not
          # 2.1.0-rc1 and not dev.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac
